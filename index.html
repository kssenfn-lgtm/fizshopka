<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizshopka</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f0f12;
            color: #fff;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .logo {
            text-align: center;
            margin: 25px 0 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 800;
        }

        .logo p {
            color: #999;
            margin-top: 8px;
        }

        .product {
            background: #18181d;
            border: 1px solid #29292f;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .product h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .product p {
            color: #999;
            margin: 5px 0;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border: none;
            border-radius: 14px;
            background: #fff;
            color: #111;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        .secondary {
            background: #242429;
            color: #fff;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>⚡ Fizshopka</h1>
        <p>Магазин номеров</p>
    </div>

    <div class="product">
        <h2>🇺🇸 Номер США</h2>
        <p>Виртуальный номер США</p>

        <div class="price">
            ⭐ 75 Stars
        </div>

        <button onclick="buyUSA()">
            🛒 Купить за 75 ⭐
        </button>
    </div>

    <div class="product">
        <h2>💰 Прайс</h2>
        <p>Другие товары и актуальные цены</p>

        <button class="secondary" onclick="price()">
            💰 Открыть прайс
        </button>
    </div>

    <div class="product">
        <h2>💬 Поддержка</h2>
        <p>Возникли вопросы? Напиши нам.</p>

        <button class="secondary" onclick="support()">
            💬 Поддержка
        </button>
    </div>

    <div class="footer">
        Fizshopka © 2026
    </div>

</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function buyUSA() {
        tg.showAlert("🇺🇸 Номер США — 75 ⭐");
    }

    function price() {
        tg.showAlert("💰 Прайс скоро будет доступен!");
    }

    function support() {
        tg.showAlert("💬 Поддержка скоро будет подключена!");
    }
</script>

</body>
</html>

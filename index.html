<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizshopka</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f0f12;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .logo {
            text-align: center;
            margin: 25px 0 35px;
        }

        .logo h1 {
            margin: 0;
            font-size: 34px;
        }

        .logo p {
            color: #999;
        }

        .product {
            background: #18181d;
            border: 1px solid #29292f;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .product h2 {
            margin: 0 0 8px;
        }

        .product p {
            color: #999;
            line-height: 1.5;
        }

        .price {
            font-size: 23px;
            font-weight: bold;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: 0;
            border-radius: 14px;
            background: white;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(.97);
        }

        .secondary {
            background: #242429;
            color: white;
        }

        .hidden {
            display: none;
        }

        .back {
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 30px;
        }

        .country {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ГЛАВНАЯ -->
    <div id="home">

        <div class="logo">
            <h1>⚡ Fizshopka</h1>
            <p>Магазин виртуальных номеров</p>
        </div>

        <div class="product">
            <h2>🌎 Виртуальные номера</h2>
            <p>Выберите нужную страну для покупки номера.</p>

            <button onclick="openCountries()">
                🛒 Выбрать страну
            </button>
        </div>

        <div class="product">
            <h2>💰 Прайс</h2>

            <button class="secondary" onclick="showPrice()">
                Открыть прайс
            </button>
        </div>

        <div class="product">
            <h2>💬 Поддержка</h2>

            <button class="secondary" onclick="support()">
                Поддержка
            </button>
        </div>

    </div>


    <!-- СТРАНЫ -->
    <div id="countries" class="hidden">

        <button class="secondary back" onclick="goHome()">
            ← Назад
        </button>

        <div class="logo">
            <h1>🌎 Страны</h1>
            <p>Все номера — 75 ⭐</p>
        </div>

        <div class="product">

            <button class="country" onclick="selectCountry('🇺🇸 США')">
                🇺🇸 США — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇬🇧 Великобритания')">
                🇬🇧 Великобритания — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇮🇳 Индия')">
                🇮🇳 Индия — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇧🇷 Бразилия')">
                🇧🇷 Бразилия — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇲🇽 Мексика')">
                🇲🇽 Мексика — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇪🇸 Испания')">
                🇪🇸 Испания — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇯🇵 Япония')">
                🇯🇵 Япония — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇰🇷 Южная Корея')">
                🇰🇷 Южная Корея — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇸🇬 Сингапур')">
                🇸🇬 Сингапур — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇮🇩 Индонезия')">
                🇮🇩 Индонезия — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇵🇭 Филиппины')">
                🇵🇭 Филиппины — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇻🇳 Вьетнам')">
                🇻🇳 Вьетнам — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇲🇾 Малайзия')">
                🇲🇾 Малайзия — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇿🇦 ЮАР')">
                🇿🇦 ЮАР — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇳🇬 Нигерия')">
                🇳🇬 Нигерия — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇪🇬 Египет')">
                🇪🇬 Египет — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇵🇰 Пакистан')">
                🇵🇰 Пакистан — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇧🇩 Бангладеш')">
                🇧🇩 Бангладеш — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇵🇪 Перу')">
                🇵🇪 Перу — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇨🇱 Чили')">
                🇨🇱 Чили — 75 ⭐
            </button>

            <button class="country" onclick="selectCountry('🇨🇴 Колумбия')">
                🇨🇴 Колумбия — 75 ⭐
            </button>

        </div>

    </div>


    <!-- ОПЛАТА -->
    <div id="payment" class="hidden">

        <button class="secondary back" onclick="openCountries()">
            ← Назад
        </button>

        <div class="logo">
            <h1>💳 Оплата</h1>
            <p id="selectedCountry">Номер — 75 ⭐</p>
        </div>

        <div class="product">

            <h2>Выберите способ оплаты</h2>

            <button onclick="starsPayment()">
                ⭐ Telegram Stars
            </button>

            <button class="secondary" onclick="giftPayment()">
                🎁 Оплата подарком
            </button>

            <button class="secondary" onclick="paypalPayment()">
                💵 PayPal (USD)
            </button>

        </div>

    </div>


    <div class="footer">
        Fizshopka © 2026
    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    let selectedCountry = "";


    function hideAll() {
        document.getElementById("home").classList.add("hidden");
        document.getElementById("countries").classList.add("hidden");
        document.getElementById("payment").classList.add("hidden");
    }


    function goHome() {
        hideAll();
        document.getElementById("home").classList.remove("hidden");
    }


    function openCountries() {
        hideAll();
        document.getElementById("countries").classList.remove("hidden");
    }


    function selectCountry(country) {

        selectedCountry = country;

        hideAll();

        document.getElementById("payment").classList.remove("hidden");

        document.getElementById("selectedCountry").innerText =
            country + " — 75 ⭐";
    }


    function starsPayment() {

        tg.showAlert(
            "⭐ Telegram Stars\n\n" +
            "Страна: " + selectedCountry + "\n" +
            "Цена: 75 ⭐\n\n" +
            "Для оформления оплаты используйте кнопку оплаты."
        );

    }


    function giftPayment() {

        tg.showAlert(
            "🎁 Оплата подарком\n\n" +
            "Страна: " + selectedCountry + "\n\n" +
            "Для оплаты подарком обратитесь в поддержку."
        );

    }


    function paypalPayment() {

        tg.showAlert(
            "💵 PayPal\n\n" +
            "Оплата в USD.\n\n" +
            "Для оплаты обратитесь в поддержку."
        );

    }


    function showPrice() {

        tg.showAlert(
            "💰 Прайс\n\n" +
            "Все доступные номера — 75 ⭐"
        );

    }


    function support() {

        tg.showAlert(
            "💬 Поддержка\n\n" +
            "Обратитесь в поддержку по вопросам заказа."
        );

    }

</script>

</body>
</html>

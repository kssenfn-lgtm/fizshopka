<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizshopka</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f0f12;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .logo {
            text-align: center;
            margin: 25px 0 35px;
        }

        .logo h1 {
            margin: 0;
            font-size: 34px;
        }

        .logo p {
            color: #999;
        }

        .product {
            background: #18181d;
            border: 1px solid #29292f;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .product h2 {
            margin: 0 0 8px;
        }

        .product p {
            color: #999;
            line-height: 1.5;
        }

        .price {
            font-size: 23px;
            font-weight: bold;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: 0;
            border-radius: 14px;
            background: white;
            color: #111;
            font-size: 17px;
            font-weight: bold;
        }

        button:active {
            transform: scale(.97);
        }

        .secondary {
            background: #242429;
            color: white;
        }

        .hidden {
            display: none;
        }

        .back {
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ГЛАВНАЯ -->

    <div id="home">

        <div class="logo">
            <h1>⚡ Fizshopka</h1>
            <p>Магазин номеров</p>
        </div>

        <div class="product">
            <h2>🇺🇸 Номер США</h2>
            <p>Виртуальный номер США</p>

            <div class="price">
                ⭐ 75 Stars
            </div>

            <button onclick="openPayment()">
                🛒 Купить
            </button>
        </div>

        <div class="product">
            <h2>💰 Прайс</h2>
            <button class="secondary" onclick="showPrice()">
                Открыть прайс
            </button>
        </div>

        <div class="product">
            <h2>💬 Поддержка</h2>
            <button class="secondary" onclick="support()">
                Поддержка
            </button>
        </div>

    </div>


    <!-- ВЫБОР ОПЛАТЫ -->

    <div id="payment" class="hidden">

        <button class="secondary back" onclick="goHome()">
            ← Назад
        </button>

        <div class="logo">
            <h1>💳 Оплата</h1>
            <p>🇺🇸 Номер США — 75 ⭐</p>
        </div>

        <div class="product">

            <h2>Выберите способ оплаты</h2>

            <button onclick="starsPayment()">
                ⭐ Telegram Stars
            </button>

            <button class="secondary" onclick="paypalPayment()">
                💵 PayPal (USD)
            </button>

        </div>

    </div>


    <div class="footer">
        Fizshopka © 2026
    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    function openPayment() {
        document.getElementById("home").classList.add("hidden");
        document.getElementById("payment").classList.remove("hidden");
    }


    function goHome() {
        document.getElementById("payment").classList.add("hidden");
        document.getElementById("home").classList.remove("hidden");
    }


    function starsPayment() {
        tg.showAlert(
            "⭐ Telegram Stars\n\n" +
            "Номер США — 75 Stars\n\n" +
            "Автоматическая оплата будет подключена следующим шагом."
        );
    }


    function paypalPayment() {
        tg.showAlert(
            "💵 PayPal\n\n" +
            "Оплата в USD.\n\n" +
            "Для оплаты обратитесь в поддержку."
        );
    }


    function showPrice() {
        tg.showAlert(
            "💰 Прайс\n\n" +
            "🇺🇸 Номер США — 75 ⭐"
        );
    }


    function support() {
        tg.showAlert(
            "💬 Поддержка\n\n" +
            "Обратитесь в поддержку по вопросам заказа."
        );
    }

</script>

</body>
</html>

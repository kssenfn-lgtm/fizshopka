<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fizshopka</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f0f12;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .logo {
            text-align: center;
            margin: 25px 0 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 34px;
        }

        .logo p {
            color: #999;
        }

        .product {
            background: #18181d;
            border: 1px solid #29292f;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .country {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .country-info {
            flex: 1;
        }

        .country-name {
            font-size: 19px;
            font-weight: bold;
        }

        .country-price {
            color: #aaa;
            margin-top: 5px;
        }

        button {
            border: 0;
            border-radius: 14px;
            background: white;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            padding: 13px 17px;
            cursor: pointer;
        }

        button:active {
            transform: scale(.97);
        }

        .buy {
            min-width: 105px;
        }

        .secondary {
            width: 100%;
            background: #242429;
            color: white;
            margin-top: 12px;
        }

        .hidden {
            display: none;
        }

        .back {
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 30px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <div id="home">

        <div class="logo">

            <h1>⚡ Fizshopka</h1>

            <p>
                Магазин виртуальных номеров
            </p>

        </div>

        <div id="countries"></div>

        <div class="product">

            <button
                class="secondary"
                onclick="showPrice()"
            >
                💰 Прайс
            </button>

            <button
                class="secondary"
                onclick="support()"
            >
                💬 Поддержка
            </button>

        </div>

    </div>


    <div id="payment" class="hidden">

        <button
            class="secondary back"
            onclick="goHome()"
        >
            ← Назад
        </button>

        <div class="logo">

            <h1>🎁 Оплата</h1>

            <p id="selectedCountry"></p>

        </div>

        <div class="product">

            <h2>
                Оплата подарками
            </h2>

            <p>
                💐 Букет — 50 ⭐
            </p>

            <p>
                🌹 Роза — 25 ⭐
            </p>

            <p>
                <b>
                    Всего — 75 ⭐
                </b>
            </p>

            <button
                class="secondary"
                onclick="giftPayment()"
            >
                🎁 Перейти к оплате
            </button>

        </div>

    </div>


    <div class="footer">
        Fizshopka © 2026
    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    const countries = [

        ["usa", "🇺🇸", "США"],
        ["uk", "🇬🇧", "Великобритания"],
        ["spain", "🇪🇸", "Испания"],
        ["india", "🇮🇳", "Индия"],
        ["indonesia", "🇮🇩", "Индонезия"],
        ["brazil", "🇧🇷", "Бразилия"],
        ["mexico", "🇲🇽", "Мексика"],
        ["japan", "🇯🇵", "Япония"],
        ["korea", "🇰🇷", "Южная Корея"]

    ];


    let selectedCountry = null;

    let selectedCountryName = null;


    function renderCountries() {

        const container =
            document.getElementById("countries");

        countries.forEach(country => {

            const code = country[0];

            const flag = country[1];

            const name = country[2];


            const product =
                document.createElement("div");

            product.className = "product";


            product.innerHTML = `

                <div class="country">

                    <div class="country-info">

                        <div class="country-name">

                            ${flag} ${name}

                        </div>

                        <div class="country-price">

                            🎁 75 ⭐

                        </div>

                    </div>


                    <button
                        class="buy"
                        onclick="openPayment(
                            '${code}',
                            '${flag} ${name}'
                        )"
                    >
                        Купить
                    </button>

                </div>

            `;


            container.appendChild(product);

        });

    }


    renderCountries();


    function openPayment(code, name) {

        selectedCountry = code;

        selectedCountryName = name;


        document
            .getElementById("home")
            .classList.add("hidden");


        document
            .getElementById("payment")
            .classList.remove("hidden");


        document
            .getElementById("selectedCountry")
            .textContent =
            name + " — 75 ⭐";

    }


    function goHome() {

        document
            .getElementById("payment")
            .classList.add("hidden");


        document
            .getElementById("home")
            .classList.remove("hidden");

    }


    function giftPayment() {

        if (!selectedCountry) {

            tg.showAlert(
                "❌ Сначала выберите страну."
            );

            return;

        }


        const url =
            "https://t.me/fizshopka_bot?start=buy_"
            + selectedCountry;


        tg.openTelegramLink(url);

    }


    function showPrice() {

        tg.showAlert(

            "💰 Прайс\n\n" +

            "Все номера — 75 ⭐\n\n" +

            "💐 Букет — 50 ⭐\n" +

            "🌹 Роза — 25 ⭐"

        );

    }


    function support() {

        tg.showAlert(

            "💬 Поддержка\n\n" +

            "Обратитесь в поддержку по вопросам заказа."

        );

    }

</script>

</body>

</html>

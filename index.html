<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Физшопка</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        body {

            margin: 0;

            padding: 20px;

            font-family: Arial, sans-serif;

            text-align: center;

        }

        h1 {

            margin-top: 40px;

        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border: none;

            border-radius: 12px;

            font-size: 18px;

            cursor: pointer;

        }

    </style>

</head>

<body>

    <h1>👋 Привет!</h1>

    <p>Добро пожаловать в Физшопку</p>

    <button onclick="hello()">🚀 Начать</button>

    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();

        tg.expand();

        function hello() {

            tg.showAlert("Приложение работает!");

        }

    </script>

</body>

</html>
